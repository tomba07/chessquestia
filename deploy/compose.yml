services:
    chessquestia:
      build:
        context: ..
      restart: unless-stopped
      container_name: chessquestia
      environment:
        NODE_ENV: production
        PORT: 5678
        PUBLIC_BASE_URL: https://${CHESSQUESTIA_DOMAIN}
        ROOMS_FILE: /data/chessquestia-rooms.json
        AUTH_FILE: /data/chessquestia-auth.json
        DB_FILE: /data/chessquestia.sqlite
        GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
        GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      volumes:
        - chessquestia_data:/data
      expose:
        - "5678"
      networks:
        - web
      healthcheck:
        test: ["CMD", "node", "-e",
  "fetch('http://127.0.0.1:5678/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
        interval: 30s
        timeout: 5s
        retries: 3
  
  volumes:
    chessquestia_data:

  networks:
    web:
      name: web
      external: true
